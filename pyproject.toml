[project]
name = "neural-st-inference"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aloret", email = "alexandre.loret@minesparis.psl.eu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "gpytorch>=1.15.2",
    "gstlearn[doc,plot]>=1.11.1",
    "ipython>=9.17.1",
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "nvidia-cuda-cccl-cu12==12.6.77",
    "nvidia-cuda-nvcc-cu12==12.4.131",
    "nvidia-cuda-nvrtc-cu12==12.4.127",
    "nvidia-cuda-runtime-cu12==12.4.127",
    "pykeops>=2.3",
    "pyro-ppl>=1.9.1",
    "pytorch-minimize>=0.1.0",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "touying>=0.14.4",
    "tqdm>=4.70.0",
    "typst>=0.15.0",
    "xarray>=2026.7.0",
]

[project.scripts]
neural-st-inference = "neural_st_inference:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
